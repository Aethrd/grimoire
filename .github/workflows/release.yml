name: Release

# Builds a signed APK and attaches it to a GitHub release. There is no Play
# Store in this project, so there is no bundle, no track and no service
# account -- just an APK you can install.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.2.0'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            NAME="${{ inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( 1000 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore the signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Android keys app data to the signing certificate. Without a stable
          # key, each build produces an APK that refuses to install over the
          # last one, so updating means uninstalling -- which deletes the
          # library. The build still works; it just warns loudly.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret. Signing with the shared key in app/signing -- fine for sideloading, and it installs over earlier builds signed the same way. See docs/RELEASING.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PversionName=${{ steps.v.outputs.name }} \
            -PversionCode=${{ steps.v.outputs.code }}

      - name: Inspect the APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk: $APK"

          AAPT=$(find "$ANDROID_HOME"/build-tools -name aapt2 | sort -r | head -1)
          "$AAPT" dump permissions "$APK" > /tmp/perms.txt || true
          echo "--- permissions ---"; cat /tmp/perms.txt

          # INTERNET is the only permission this app is meant to have, and
          # only for DeepL translation. Anything else arrived through manifest
          # merging from a dependency, and should be found here rather than by
          # a user reading the Play listing.
          UNEXPECTED=$(grep -o "uses-permission: name='[^']*'" /tmp/perms.txt \
            | sed "s/.*name='//;s/'//" \
            | grep -v '^android.permission.INTERNET$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected permissions in the APK:"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "Permissions: INTERNET only, as intended."

          SIGNER=$(find "$ANDROID_HOME"/build-tools -name apksigner | sort -r | head -1)
          "$SIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt || true
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::warning::Signed with a machine's own debug key; this APK will not install over a differently-signed one."
          fi

          {
            echo "### Grimoire ${{ steps.v.outputs.name }}"
            echo "- $(du -h "$APK" | cut -f1)"
            echo "- permissions: INTERNET only (DeepL translation)"
            echo "- stable signing key: ${{ steps.keystore.outputs.signed }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-${{ steps.v.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            Sideload build. Download the APK and install it.

            No account, no ads, no in-app purchases. The only permission is
            INTERNET, used solely for DeepL translation and inert until you
            enter an API key.
